<section class="our-blog news-section sidebar-page-container gray-bg py-5">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="row">
                    {% for post in site.posts %}
                    <div class="col-lg-6 col-md-6 col-sm-12 mb-4">
                        <div class="card h-100">
                            <a href="{{post.url}}">
                                <img class="card-img-top" src="{{post.image}}" alt="" style="height: 300px; object-fit: contain;">
                            </a>
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title"><a href="{{post.url}}">{{ post.title }}</a></h5>
                                <ul class="list-inline mb-4">
                                    <li class="list-inline-item">by <span>{{ post.author}}</span></li>
                                    <li class="list-inline-item">{{ post.date | date: "%B %-d, %Y" }}</li>
                                </ul>
                                <a href="{{post.url}}" class="btn btn-danger mt-auto">Read More</a>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>
